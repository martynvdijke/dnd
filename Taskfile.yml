version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies
    cmds:
      - go mod download
      - npm install

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  build:dice:
    desc: Build dice roller bundle with esbuild
    cmds:
      - npm run build:dice

  test:
    desc: Run Go unit tests
    deps: [build:dice]
    cmds:
      - go test -tags sqlite_fts5 -v ./...

  test:unit:
    desc: Run TypeScript unit tests (mirror of npm run test:unit)
    cmds:
      - npm run test:unit

  test:e2e:
    desc: Run Playwright end-to-end tests
    deps: [build]
    vars:
      VERSION: { sh: 'git describe --tags --always 2>/dev/null || echo 0.0.0-dev' }
    cmds:
      - rm -f villum.db villum.db-wal villum.db-shm
      - go build -tags sqlite_fts5 -ldflags "-X main.Version={{.VERSION}}" -o villum-server .
      - npx playwright test --project=chromium

  build:vite:
    desc: Build frontend bundles with Vite
    cmds:
      - npm run build:vite

  typecheck:
    desc: Type-check TypeScript
    cmds:
      - npm run typecheck

  build:ts:
    desc: Compile TypeScript (Vite bundles + typecheck)
    cmds:
      - task: build:vite
      - task: typecheck

  build:
    desc: Build Go binary
    vars:
      VERSION: { sh: 'git describe --tags --always 2>/dev/null || echo 0.0.0-dev' }
    deps: [build:dice]
    cmds:
      - task: build:ts
      - go build -tags sqlite_fts5 -ldflags "-X main.Version={{.VERSION}}" -o villum-server .

  run:
    desc: Run the application
    cmds:
      - go run main.go

  dev:
    desc: Run with hot-reload
    cmds:
      - air

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build . -t villum:local

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f villum-server
      - rm -f villum.db*
      - rm -rf playwright-report test-results static/js/*

  ci:
    desc: Full CI parity suite (mirrors ci.yaml job order)
    cmds:
      - scripts/ci/run-all.sh

  trmnl:lint:
    desc: Lint the TRMNL plugin with trmnlp (requires ruby + trmnl_preview gem)
    cmds:
      - gem install trmnl_preview
      - cd trmnl && trmnlp lint
