version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies
    cmds:
      - go mod download
      - npm install

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  test:
    desc: Run Go unit tests
    cmds:
      - go test -v ./...

  test:e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - rm -f villum.db villum.db-wal villum.db-shm
      - npx playwright test

  build:vite:
    desc: Build frontend bundles with Vite
    cmds:
      - npm run build:vite

  typecheck:
    desc: Type-check TypeScript
    cmds:
      - npm run typecheck

  build:ts:
    desc: Compile TypeScript (Vite bundles + typecheck)
    cmds:
      - task: build:vite
      - task: typecheck

  build:
    desc: Build Go binary
    cmds:
      - task: build:ts
      - go build -o villum-server .

  run:
    desc: Run the application
    cmds:
      - go run main.go

  dev:
    desc: Run with hot-reload
    cmds:
      - air

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build . -t villum:local

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f villum-server
      - rm -f villum.db*
      - rm -rf playwright-report test-results static/js/*
