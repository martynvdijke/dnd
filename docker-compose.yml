services:
  villum:
    build: .
    ports:
      - "6280:6280"
    environment:
      - DB_PATH=/db/villum.db
      - MEDIA_PATH=/app/media
      - PORT=6280
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=villum
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production
      # OIDC SSO via Authelia (disabled unless OIDC_ENABLED=true).
      # Secret via file (preferred) or env — never commit values.
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET_FILE=${OIDC_CLIENT_SECRET_FILE:-}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
    volumes:
      - villum-data:/db
      - villum-media:/app/media
      - ./backups:/app/backups
    restart: unless-stopped

volumes:
  villum-data:
  villum-media:
