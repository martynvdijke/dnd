services:
  villum:
    build: .
    ports:
      - "6280:6280"
    environment:
      - DB_PATH=/db/villum.db
      - MEDIA_PATH=/app/media
      - PORT=6280
    volumes:
      - villum-data:/db
      - villum-media:/app/media
      - ./backups:/app/backups
    restart: unless-stopped

volumes:
  villum-data:
  villum-media:
