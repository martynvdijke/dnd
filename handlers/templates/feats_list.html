<div class="d-flex justify-content-between align-items-center">
  <h5>Feats</h5>
  <button class="btn btn-primary btn-sm" hx-get="/htmx/feats/new?character_id={{.CharacterID}}" hx-target="#genericModalBody" hx-trigger="click" onclick="document.getElementById('genericModalTitle').textContent='Add Feat';bootstrap.Modal.getOrCreateInstance(document.getElementById('genericModal')).show()"><i class="fa-solid fa-plus me-1"></i>Add Feat</button>
</div>
<div class="mt-2">
{{if .Feats}}
  {{range .Feats}}
  <div class="card mb-2">
    <div class="card-body py-2 px-3">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <span class="fw-bold">{{.Name}}</span>
          <span class="badge badge-blood ms-1">Lv {{.LevelGained}}</span>
          {{if .Source}}<span class="badge badge-gold ms-1">{{.Source}}</span>{{end}}
          {{if .Prerequisites}}<span class="badge badge-muted ms-1">{{.Prerequisites}}</span>{{end}}
          <p class="mb-0 mt-1 small text-muted">{{.Description}}</p>
        </div>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-outline-primary" hx-get="/htmx/feats/{{.ID}}/edit" hx-target="#genericModalBody" hx-trigger="click" onclick="document.getElementById('genericModalTitle').textContent='Edit Feat';bootstrap.Modal.getOrCreateInstance(document.getElementById('genericModal')).show()"><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-sm btn-outline-danger" hx-delete="/htmx/feats/{{.ID}}" hx-target="#featsSection" hx-swap="innerHTML" hx-confirm="Remove this feat?"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    </div>
  </div>
  {{end}}
{{else}}
  <div class="empty-state"><i class="fa-solid fa-star fa-3x mb-2 d-block text-muted"></i><p class="fw-bold">No Feats</p><p class="small text-muted">Track your character feats here (distinct from class/race features).</p></div>
{{end}}
</div>
<script>(function(){var m=document.getElementById("genericModal");if(m&&m.classList.contains("show")){bootstrap.Modal.getInstance(m)?.hide()}})()</script>
