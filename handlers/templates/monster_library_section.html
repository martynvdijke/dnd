{{define "monster_library_section"}}
<div class="mb-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6 class="mb-0"><i class="fa-solid fa-book me-2"></i>Monster Library</h6>
    <button class="btn btn-sm btn-success" hx-get="/htmx/monster-library/new" hx-target="#monsterLibraryFormContainer" hx-swap="innerHTML">
      <i class="fa-solid fa-plus me-1"></i>New Custom Monster
    </button>
  </div>
  <div id="monsterLibraryFormContainer"></div>
  {{if .Monsters}}
  <div class="list-group list-group-flush">
    {{range .Monsters}}
    <div class="list-group-item py-2 px-0">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <strong>{{.Name}}</strong>
          <span class="badge bg-danger ms-1">CR {{.CR}}</span>
          <span class="text-muted small ms-2">AC {{.AC}} · HP {{.HP}}</span>
          <div class="small text-muted mt-1">
            STR {{.Str}} DEX {{.Dex}} CON {{.Con}} INT {{.Int}} WIS {{.Wis}} CHA {{.Cha}}
          </div>
        </div>
        <div class="d-flex gap-1 flex-shrink-0">
          <button class="btn btn-sm btn-outline-primary" hx-get="/htmx/monster-library/new?edit_id={{.ID}}" hx-target="#monsterLibraryFormContainer" hx-swap="innerHTML">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" hx-delete="/htmx/monster-library/{{.ID}}" hx-target="#monsterLibraryFormContainer" hx-swap="innerHTML" hx-confirm="Delete {{.Name}}? This cannot be undone.">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
    {{end}}
  </div>
  {{else}}
  <div class="text-muted small fst-italic py-2">No custom monsters yet. Create one!</div>
  {{end}}
</div>
{{end}}
