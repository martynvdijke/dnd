{{if .Session}}
<input type="hidden" name="id" value="{{.Session.ID}}">
{{end}}
<input type="hidden" name="character_id" value="{{.CharacterID}}">
<div class="mb-3"><label class="form-label">Title</label><input class="form-control" name="title" value="{{if .Session}}{{.Session.Title}}{{end}}"></div>
<div class="mb-3"><label class="form-label">Date</label><input class="form-control" name="session_date" type="date" value="{{if .Session}}{{.Session.SessionDate}}{{end}}"></div>
<div class="row g-3 mb-3">
  <div class="col-6"><label class="form-label">XP Earned</label><input class="form-control" name="xp_earned" type="number" value="{{if .Session}}{{.Session.XPEarned}}{{else}}0{{end}}"></div>
  <div class="col-6"><label class="form-label">Gold Earned</label><input class="form-control" name="gold_earned" type="number" value="{{if .Session}}{{.Session.GoldEarned}}{{else}}0{{end}}"></div>
</div>
<div class="mb-3"><label class="form-label">Summary / Important Events</label><textarea class="form-control" name="important_events" rows="4">{{if .Session}}{{.Session.ImportantEvents}}{{end}}</textarea></div>
<div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3">{{if .Session}}{{.Session.Notes}}{{end}}</textarea></div>
{{if .Session}}
<button class="btn btn-primary w-100" hx-put="/htmx/sessions/{{.Session.ID}}" hx-target="#sessionsSection" hx-swap="outerHTML" hx-include="closest form"><i class="fa-solid fa-save me-1"></i>Save Session</button>
{{else}}
<button class="btn btn-primary w-100" hx-post="/htmx/sessions" hx-target="#sessionsSection" hx-swap="outerHTML" hx-include="closest form"><i class="fa-solid fa-plus me-1"></i>Create Session</button>
{{end}}
