{{if .Shops}}
<div class="list-group list-group-flush">
  {{range .Shops}}
  <div class="list-group-item py-2 px-0 d-flex justify-content-between align-items-start">
    <div>
      <strong>{{.Name}}</strong>
      <span class="badge bg-secondary ms-1">{{.Type}}</span>
      <div class="small text-muted">{{truncate .Description 100}}</div>
      <div class="small text-muted">Markup: {{.Markup}}%</div>
    </div>
    <button class="btn btn-sm btn-outline-danger" onclick="deleteOneShotShop({{.ID}})"><i class="fa-solid fa-trash"></i></button>
  </div>
  {{end}}
</div>
{{else}}
<div class="text-muted small fst-italic">No shops yet.</div>
{{end}}
<div class="mt-2">
  <button class="btn btn-sm btn-outline-primary" onclick="showOneShotShopForm({{.AdventureID}})"><i class="fa-solid fa-plus me-1"></i>Add Shop</button>
</div>
