<div class="d-flex justify-content-between align-items-center">
  <h5>Game Sessions</h5>
  <button class="btn btn-primary btn-sm" hx-get="/htmx/sessions/new?character_id={{.CharacterID}}" hx-target="#genericModalBody" hx-trigger="click" data-bs-toggle="modal" data-bs-target="#genericModal" onclick="document.getElementById('genericModalTitle').textContent='New Session'"><i class="fa-solid fa-plus me-1"></i>New Session</button>
</div>
{{if .Sessions}}
  {{range .Sessions}}
  <div class="card mb-2">
    <div class="card-body py-2 px-3">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <span class="fw-bold">{{.Title}}</span>
          <span class="badge badge-blood ms-1">{{.SessionDate}}</span>
          <p class="mb-0 mt-1 small text-muted">{{.ImportantEvents | truncate 200}}</p>
        </div>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-outline-primary" hx-get="/htmx/sessions/{{.ID}}/edit" hx-target="#genericModalBody" hx-trigger="click" data-bs-toggle="modal" data-bs-target="#genericModal" onclick="document.getElementById('genericModalTitle').textContent='Edit Session'"><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-sm btn-outline-danger" hx-delete="/htmx/sessions/{{.ID}}" hx-target="#sessionsSection" hx-swap="outerHTML" hx-confirm="Delete this session?"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    </div>
  </div>
  {{end}}
{{else}}
  <div class="empty-state"><i class="fa-solid fa-calendar-days fa-3x mb-2 d-block text-muted"></i><p class="fw-bold">No Sessions</p><p class="small text-muted">Log your game sessions to keep track of your adventure.</p></div>
{{end}}
