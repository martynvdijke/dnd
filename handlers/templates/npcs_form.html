<form><input type="hidden" name="character_id" value="{{.CharacterID}}">
<div class="mb-3"><label class="form-label">NPC Name</label><input class="form-control" id="newNPCName" name="name" placeholder="NPC name"></div>
<div class="row g-3 mb-3">
  <div class="col-6"><label class="form-label">Type</label>
    <select class="form-select" name="type">
      <option value="ally">Ally</option><option value="neutral">Neutral</option>
      <option value="enemy">Enemy</option><option value="merchant">Merchant</option>
      <option value="quest_giver">Quest Giver</option>
    </select>
  </div>
  <div class="col-6"><label class="form-label">Race</label><input class="form-control" id="newNPCRace" name="race" placeholder="Elf, Dwarf, etc."></div>
</div>
<div class="mb-3"><label class="form-label">Class</label><input class="form-control" id="newNPCClass" name="class" placeholder="NPC class"></div>
<div class="mb-3">
  <label class="form-label">NPC Tier</label>
  <select class="form-select" name="is_full" id="npcTier">
    <option value="0">Simple (backstory only)</option>
    <option value="1">Full (character sheet stats)</option>
  </select>
</div>
<div id="npcFullFields" style="display:none">
  <div class="row g-3 mb-3">
    <div class="col-4"><label class="form-label">AC</label><input class="form-control" name="ac" type="number" value="10"></div>
    <div class="col-4"><label class="form-label">Speed</label><input class="form-control" name="speed" placeholder="30 ft"></div>
    <div class="col-4"><label class="form-label">HP</label><input class="form-control" name="hp" type="number" value="10"></div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-2"><label class="form-label">STR</label><input class="form-control" name="str" type="number" value="10"></div>
    <div class="col-2"><label class="form-label">DEX</label><input class="form-control" name="dex" type="number" value="10"></div>
    <div class="col-2"><label class="form-label">CON</label><input class="form-control" name="con" type="number" value="10"></div>
    <div class="col-2"><label class="form-label">INT</label><input class="form-control" name="int" type="number" value="10"></div>
    <div class="col-2"><label class="form-label">WIS</label><input class="form-control" name="wis" type="number" value="10"></div>
    <div class="col-2"><label class="form-label">CHA</label><input class="form-control" name="cha" type="number" value="10"></div>
  </div>
  <div class="mb-3"><label class="form-label">Saving Throws</label><input class="form-control" name="saves" placeholder="e.g. Str +3, Dex +5"></div>
  <div class="mb-3"><label class="form-label">Skills</label><input class="form-control" name="skills" placeholder="e.g. Stealth +7, Perception +4"></div>
  <div class="mb-3"><label class="form-label">Features / Traits</label><textarea class="form-control" name="features" rows="3" placeholder="Special abilities, traits..."></textarea></div>
  <div class="mb-3"><label class="form-label">Actions</label><textarea class="form-control" name="actions" rows="3" placeholder="Attacks, spells, actions..."></textarea></div>
</div>
<div class="mb-3">
  <label class="form-label">Description / Backstory</label>
  <textarea class="form-control" id="newNPCDesc" name="description" rows="3"></textarea>
  <button class="btn btn-sm btn-outline-primary mt-2 ai-generate-btn" type="button" data-ai-mode="text" data-ai-target="newNPCDesc" data-ai-hint="Write a compelling backstory for this NPC" data-ai-title="Generate NPC Backstory"><i class="fa-solid fa-wand-magic-sparkles me-1"></i>Generate with AI</button>
</div>
<div class="mb-3">
  <label class="form-label">Portrait URL</label>
  <div class="input-group">
    <input class="form-control" name="portrait_url" id="npPortraitUrl" placeholder="URL or upload below">
    <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('npPortraitUpload').click()"><i class="fa-solid fa-upload"></i></button>
    <input type="file" id="npPortraitUpload" accept="image/*" style="display:none" onchange="uploadNPCPortrait(this.files)">
  </div>
  <button class="btn btn-sm btn-outline-primary mt-2 ai-generate-btn" type="button" data-ai-mode="image" data-ai-target="npPortraitUrl" data-ai-hint="Fantasy portrait of this NPC" data-ai-title="Generate NPC Portrait"><i class="fa-solid fa-wand-magic-sparkles me-1"></i>Generate with AI</button>
</div>
<button class="btn btn-primary w-100" hx-post="/htmx/npcs" hx-target="#npcsSection" hx-swap="innerHTML" hx-include="closest form"><i class="fa-solid fa-plus me-1"></i>Create</button>
<script>
function uploadNPCPortrait(files) {
  if (!files.length) return;
  var formData = new FormData();
  formData.append("image", files[0]);
  formData.append("owner_type", "npc");
  var xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload", true);
  xhr.setRequestHeader("X-CSRF-Token", document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '');
  xhr.onload = function() {
    if (xhr.status === 200) {
      var resp = JSON.parse(xhr.responseText);
      document.getElementById("npPortraitUrl").value = resp.url;
    }
  };
  xhr.send(formData);
}
</script>
</form>
<script>
document.getElementById('npcTier').addEventListener('change', function(){
  var isFull = this.value === '1';
  document.getElementById('npcFullFields').style.display = isFull ? 'block' : 'none';
});
</script>
