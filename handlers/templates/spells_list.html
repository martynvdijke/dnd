<div class="d-flex justify-content-between align-items-center">
  <h5>Spells</h5>
  <button class="btn btn-primary btn-sm" hx-get="/htmx/spells/new?character_id={{.CharacterID}}" hx-target="#genericModalBody" hx-trigger="click" onclick="document.getElementById('genericModalTitle').textContent='New Spell';bootstrap.Modal.getOrCreateInstance(document.getElementById('genericModal')).show()"><i class="fa-solid fa-plus me-1"></i>Add Spell</button>
</div>
<div class="mt-2">
{{if .Spells}}
  {{range .Spells}}
  <div class="inv-item d-flex justify-content-between align-items-center">
    <div>
      <span class="fw-bold">{{.Name}}</span>
      <span class="badge badge-blood ms-1">{{.Level}}</span>
      {{if .School}}<span class="badge badge-gold ms-1">{{.School}}</span>{{end}}
      {{if .CastingTime}}<span class="badge badge-muted ms-1">{{.CastingTime}}</span>{{end}}
      {{if .Duration}}<span class="badge badge-muted ms-1">{{.Duration}}</span>{{end}}
      <p class="mb-0 small text-muted">{{.Description | truncate 150}}</p>
    </div>
    <div class="d-flex gap-1">
      <button class="btn btn-sm btn-outline-primary" hx-get="/htmx/spells/{{.ID}}/edit" hx-target="#genericModalBody" hx-trigger="click" onclick="document.getElementById('genericModalTitle').textContent='Edit Spell';bootstrap.Modal.getOrCreateInstance(document.getElementById('genericModal')).show()"><i class="fa-solid fa-pen"></i></button>
      <button class="btn btn-sm btn-outline-danger" hx-delete="/htmx/spells/{{.ID}}" hx-target="#spellsSection" hx-swap="outerHTML" hx-confirm="Remove this spell?"><i class="fa-solid fa-trash"></i></button>
    </div>
  </div>
  {{end}}
{{else}}
  <div class="empty-state"><i class="fa-solid fa-wand-magic fa-3x mb-2 d-block text-muted"></i><p class="fw-bold">No Spells</p><p class="small text-muted">Add spells from your spellbook or known spells.</p></div>
{{end}}
</div>
<script>(function(){var m=document.getElementById("genericModal");if(m&&m.classList.contains("show")){bootstrap.Modal.getInstance(m)?.hide()}})()</script>
