<form>{{if .Event}}
<input type="hidden" name="id" value="{{.Event.ID}}">
{{end}}
<div class="mb-3"><label class="form-label">Title</label><input class="form-control" name="title" value="{{if .Event}}{{.Event.Title}}{{end}}"></div>
<div class="mb-3"><label class="form-label">Date</label><input class="form-control" name="event_date" type="date" value="{{if .Event}}{{.Event.EventDate}}{{end}}"></div>
<div class="row g-3 mb-3">
  <div class="col-6"><label class="form-label">Type</label>
    <select class="form-select" name="event_type">
      <option value="major" {{if and .Event (eq .Event.EventType "major")}}selected{{end}}>Major</option>
      <option value="minor" {{if and .Event (eq .Event.EventType "minor")}}selected{{end}}>Minor</option>
      <option value="battle" {{if and .Event (eq .Event.EventType "battle")}}selected{{end}}>Battle</option>
      <option value="discovery" {{if and .Event (eq .Event.EventType "discovery")}}selected{{end}}>Discovery</option>
    </select>
  </div>
  <div class="col-6"><label class="form-label">Campaign ID</label><input class="form-control" name="campaign_id" type="number" value="{{if .Event}}{{.Event.CampaignID}}{{else}}1{{end}}"></div>
</div>
<div class="mb-3"><label class="form-label">Place</label><select class="form-select" id="tlPlace" name="linked_entity_id"><option value="">— No place —</option></select><input type="hidden" name="linked_entity_type" id="tlPlaceType" value=""></div>
<div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">{{if .Event}}{{.Event.Description}}{{end}}</textarea></div>
<script>
(function(){
  var sel=document.getElementById('tlPlace'), hid=document.getElementById('tlPlaceType');
  if(!sel) return;
  fetch('/api/locations').then(r=>r.json()).then(locs=>{
    locs.forEach(function(l){ var o=document.createElement('option'); o.value=l.id; o.textContent=l.name+' ('+l.type+')'; if('{{if .Event}}{{.Event.LinkedEntityID}}{{end}}'==String(l.id)) o.selected=true; sel.appendChild(o); });
    if(sel.value) hid.value='location';
  }).catch(()=>{});
  sel.addEventListener('change', function(){ hid.value = sel.value ? 'location' : ''; });
})();
</script>
{{if .Event}}
<button class="btn btn-primary w-100" hx-put="/htmx/timeline/{{.Event.ID}}" hx-target="#timelineContent" hx-swap="innerHTML" hx-include="closest form"><i class="fa-solid fa-save me-1"></i>Save Event</button></form>
{{else}}
<button class="btn btn-primary w-100" hx-post="/htmx/timeline" hx-target="#timelineContent" hx-swap="innerHTML" hx-include="closest form"><i class="fa-solid fa-plus me-1"></i>Create Event</button></form>
{{end}}
