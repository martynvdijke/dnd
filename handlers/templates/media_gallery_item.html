{{define "media_gallery_item"}}
<div class="col-6 col-md-4 col-lg-3">
  <div class="card media-item h-100">
    {{if .IsPDF}}
    <div class="card-img-top d-flex align-items-center justify-content-center bg-light" style="height:120px;cursor:pointer" onclick="openPdfViewer('{{.URL}}')" title="Open PDF">
      <i class="fa-solid fa-file-pdf fa-3x text-danger"></i>
    </div>
    {{else if .ThumbnailURL}}
    <img src="{{.ThumbnailURL}}" class="card-img-top" style="height:120px;object-fit:cover" alt="media">
    {{else}}
    <img src="{{.URL}}" class="card-img-top" style="height:120px;object-fit:cover" alt="media">
    {{end}}
    <div class="card-body p-1 d-flex flex-wrap gap-1">
      <button class="btn btn-sm btn-outline-secondary" onclick="copyMediaUrl('{{.URL}}')" title="Copy URL"><i class="fa-solid fa-link"></i></button>
      {{if not .IsPDF}}<button class="btn btn-sm btn-outline-info" onclick="cropMedia({{.ID}},'{{.OwnerType}}','{{.OwnerID}}')" title="Crop"><i class="fa-solid fa-crop"></i></button>{{end}}
      <button class="btn btn-sm btn-outline-danger" onclick="deleteMedia({{.LinkID}},'{{.OwnerType}}','{{.OwnerID}}')" title="Remove"><i class="fa-solid fa-trash"></i></button>
    </div>
  </div>
</div>
{{end}}
