{{define "monster_picker"}}
<div>
  <ul class="nav nav-tabs mb-2" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link {{if ne .Tab "library"}}active{{end}}" id="mpCompendiumTab" data-bs-toggle="tab" data-bs-target="#pickerCompendiumPane" type="button" role="tab"><i class="fa-solid fa-book-open me-1"></i>Compendium</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link {{if eq .Tab "library"}}active{{end}}" id="mpLibraryTab" data-bs-toggle="tab" data-bs-target="#pickerLibraryPane" type="button" role="tab"><i class="fa-solid fa-book me-1"></i>My Library</button>
    </li>
    {{if .ShowRoster}}
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="mpRosterTab" data-bs-toggle="tab" data-bs-target="#pickerRosterPane" type="button" role="tab"><i class="fa-solid fa-users me-1"></i>Campaign Roster</button>
    </li>
    {{end}}
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade {{if ne .Tab "library"}}show active{{end}}" id="pickerCompendiumPane" role="tabpanel">
      <input type="text" class="form-control form-control-sm mb-2" id="pickerCompendiumSearch" placeholder="Search monsters..." name="q"
        hx-get="/htmx/compendium-monsters/search{{if .EncounterID}}?encounter_id={{.EncounterID}}{{end}}{{if .AdventureID}}?adventure_id={{.AdventureID}}{{end}}{{if .CampaignID}}?campaign_id={{.CampaignID}}{{end}}"
        hx-trigger="keyup changed delay:300ms" hx-target="#pickerCompendiumResults" hx-swap="innerHTML">
      <div id="pickerCompendiumResults" style="max-height:40vh;overflow-y:auto">
        <div class="text-muted small py-2">Type to search the compendium...</div>
      </div>
      <div id="compendiumDetail" class="mt-2"></div>
    </div>
    <div class="tab-pane fade {{if eq .Tab "library"}}show active{{end}}" id="pickerLibraryPane" role="tabpanel">
      <div hx-get="/htmx/monster-library" hx-trigger="load" hx-swap="innerHTML">
        <div class="text-center py-3"><i class="fa-solid fa-spinner fa-spin me-1"></i>Loading library...</div>
      </div>
    </div>
    {{if .ShowRoster}}
    <div class="tab-pane fade" id="pickerRosterPane" role="tabpanel">
      <div hx-get="/htmx/campaigns/{{.CampaignID}}/monster-roster" hx-trigger="load" hx-swap="innerHTML">
        <div class="text-center py-3"><i class="fa-solid fa-spinner fa-spin me-1"></i>Loading roster...</div>
      </div>
    </div>
    {{end}}
  </div>
  <div class="mt-3 d-flex justify-content-end gap-2">
    {{if .EncounterID}}
    <button class="btn btn-sm btn-outline-secondary" hx-get="/htmx/encounters/{{.EncounterID}}/monsters/new" hx-target="#genericModalBody" hx-swap="innerHTML">
      <i class="fa-solid fa-pen me-1"></i>Create Custom
    </button>
    {{end}}
    <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>
  </div>
</div>
{{end}}
