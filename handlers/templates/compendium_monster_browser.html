{{define "compendium_monster_browser"}}
<ul class="nav nav-tabs nav-pills mb-3" id="compendiumTabs" role="tablist">
  <li class="nav-item" role="presentation">
    <button class="nav-link active" id="compendium-tab" data-bs-toggle="tab" data-bs-target="#compendiumTabContent" type="button" role="tab">
      <i class="fa-solid fa-book me-1"></i>Compendium
    </button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="library-tab" data-bs-toggle="tab" data-bs-target="#libraryTabContent" type="button" role="tab"
      hx-get="/htmx/monster-library/section" hx-target="#libraryTabContent" hx-trigger="click">
      <i class="fa-solid fa-cubes me-1"></i>My Library
    </button>
  </li>
</ul>
<div class="tab-content">
  <div class="tab-pane fade show active" id="compendiumTabContent" role="tabpanel">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="mb-0"><i class="fa-solid fa-book me-2"></i>Monster Compendium</h6>
      <div class="d-flex gap-1">
        <button class="btn btn-sm btn-outline-primary" hx-get="/htmx/compendium-monsters/import-modal" hx-target="#compendiumImportModal" hx-swap="innerHTML">
          <i class="fa-solid fa-cloud-arrow-down me-1"></i>Import from API
        </button>
      </div>
    </div>
    <div id="compendiumImportModal"></div>
    <div class="input-group mb-3">
      <input type="text" class="form-control form-control-sm" id="compendiumSearch" placeholder="Search monsters..."
        hx-get="/htmx/compendium-monsters/search" hx-trigger="keyup changed delay:300ms" hx-target="#compendiumResults" hx-swap="innerHTML" hx-include="[name='cr'],[name='type'],[name='adventure_id']">
      <select class="form-select form-select-sm" style="max-width:100px" name="cr" id="compendiumCRFilter"
        hx-get="/htmx/compendium-monsters/search" hx-trigger="change" hx-target="#compendiumResults" hx-swap="innerHTML" hx-include="[name='q'],[name='adventure_id']">
        <option value="">All CR</option>
        <option value="0">0</option>
        <option value="1/8">1/8</option>
        <option value="1/4">1/4</option>
        <option value="1/2">1/2</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="17">17</option>
        <option value="18">18</option>
        <option value="19">19</option>
        <option value="20">20</option>
        <option value="21">21</option>
        <option value="22">22</option>
        <option value="23">23</option>
        <option value="24">24</option>
        <option value="25">25</option>
        <option value="26">26</option>
        <option value="27">27</option>
        <option value="28">28</option>
        <option value="29">29</option>
        <option value="30">30</option>
      </select>
      <select class="form-select form-select-sm" style="max-width:130px" name="type" id="compendiumTypeFilter"
        hx-get="/htmx/compendium-monsters/search" hx-trigger="change" hx-target="#compendiumResults" hx-swap="innerHTML" hx-include="[name='q'],[name='adventure_id']">
        <option value="">All Types</option>
        <option value="aberration">Aberration</option>
        <option value="beast">Beast</option>
        <option value="celestial">Celestial</option>
        <option value="construct">Construct</option>
        <option value="dragon">Dragon</option>
        <option value="elemental">Elemental</option>
        <option value="fey">Fey</option>
        <option value="fiend">Fiend</option>
        <option value="giant">Giant</option>
        <option value="humanoid">Humanoid</option>
        <option value="monstrosity">Monstrosity</option>
        <option value="ooze">Ooze</option>
        <option value="plant">Plant</option>
        <option value="undead">Undead</option>
      </select>
    </div>
    {{if $.AdventureID}}<input type="hidden" name="adventure_id" value="{{$.AdventureID}}">{{end}}
    <div id="compendiumResults" hx-get="/htmx/compendium-monsters/search{{if $.AdventureID}}?adventure_id={{$.AdventureID}}{{end}}" hx-trigger="load" hx-swap="innerHTML">
      <div class="text-muted small text-center py-3"><i class="fa-solid fa-spinner fa-spin me-1"></i>Loading monsters...</div>
    </div>
  </div>
  <div class="tab-pane fade" id="libraryTabContent" role="tabpanel">
    <div class="text-muted small text-center py-3"><i class="fa-solid fa-spinner fa-spin me-1"></i>Loading library...</div>
  </div>
</div>
{{end}}
