{{if .Items}}
<div class="list-group list-group-flush">
  {{range .Items}}
  <div class="list-group-item py-2 px-0">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <strong>{{.Name}}</strong>
        {{if .IsMagical}}<span class="badge bg-info ms-1">magic</span>{{end}}
        <span class="text-muted small ms-2">{{.Category}}</span>
        <div class="small text-muted">{{truncate .Description 100}}</div>
        <div class="small text-muted mt-1">
          Qty: {{.Quantity}} | Weight: {{.Weight}} | Price: {{.PriceGP}} GP
        </div>
      </div>
      <div class="d-flex gap-1 flex-shrink-0">
        <button class="btn btn-sm btn-outline-primary" onclick="editOneShotItem({{.ID}})"><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-sm btn-outline-info" onclick="showUploadModal('item',{{.ID}})" title="Upload"><i class="fa-solid fa-upload"></i></button>
        <button class="btn btn-sm btn-outline-info" onclick="showLinkNPCToItem({{.AdventureID}},{{.ID}})" title="Link NPC"><i class="fa-solid fa-user-plus"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteOneShotItem({{.ID}})"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
    <!-- Linked NPCs loaded via JS when needed -->
    <div class="small mt-1 npc-links-{{.ID}} text-muted" style="display:none"></div>
  </div>
  {{end}}
</div>
{{else}}
<div class="text-muted small fst-italic">No items yet.</div>
{{end}}
<div class="mt-2 d-flex gap-1">
  <button class="btn btn-sm btn-outline-primary" onclick="showOneShotItemForm({{.AdventureID}})"><i class="fa-solid fa-plus me-1"></i>Add Item</button>
  <button class="btn btn-sm btn-outline-warning" onclick="showCompendiumEquipmentPickerForOneShot({{.AdventureID}})"><i class="fa-solid fa-book-open me-1"></i>From Compendium</button>
</div>
