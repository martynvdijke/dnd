<div class="d-flex justify-content-between align-items-center mb-3">
  <h5>Campaign Timeline</h5>
  <button class="btn btn-primary btn-sm" hx-get="/htmx/timeline/new" hx-target="#genericModalBody" hx-trigger="click" data-bs-toggle="modal" data-bs-target="#genericModal" onclick="document.getElementById('genericModalTitle').textContent='New Event'"><i class="fa-solid fa-plus me-1"></i>New Event</button>
</div>
{{if .Events}}
<div class="list-group">
  {{range .Events}}
  <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
    <div>
      <span class="fw-bold">{{.Title}}</span>
      <span class="badge badge-blood ms-1">{{.EventDate}}</span>
      {{if .EventType}}<span class="badge badge-gold ms-1">{{.EventType}}</span>{{end}}
      <div class="small text-muted">{{if .Description}}{{.Description | truncate 150}}{{end}}</div>
    </div>
    <div class="d-flex gap-1">
      <button class="btn btn-sm btn-outline-primary" hx-get="/htmx/timeline/{{.ID}}/edit" hx-target="#genericModalBody" hx-trigger="click" data-bs-toggle="modal" data-bs-target="#genericModal" onclick="document.getElementById('genericModalTitle').textContent='Edit Event'"><i class="fa-solid fa-pen"></i></button>
      <button class="btn btn-sm btn-outline-danger" hx-delete="/htmx/timeline/{{.ID}}" hx-target="#timelineContent" hx-swap="outerHTML" hx-confirm="Delete this event?"><i class="fa-solid fa-trash"></i></button>
    </div>
  </div>
  {{end}}
</div>
{{else}}
<div class="empty-state"><i class="fa-solid fa-timeline fa-3x mb-2 d-block text-muted"></i><p class="fw-bold">No Timeline Events</p><p class="small text-muted">Track important campaign events in chronological order.</p></div>
{{end}}
