<div class="card mb-3">
  <div class="card-header">
    <h6 class="mb-0">{{if .Clue}}Edit Clue{{else}}New Clue{{end}}</h6>
  </div>
  <div class="card-body">
    <form hx-{{if .Clue}}put="/htmx/clues/{{.Clue.ID}}"{{else}}post="/htmx/oneshot-adventures/{{.AdventureID}}/clues"{{end}}
          hx-target="#clueList" hx-swap="outerHTML">
      <div class="mb-2">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" required value="{{if .Clue}}{{.Clue.Title}}{{end}}">
      </div>
      <div class="mb-2">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="2" required>{{if .Clue}}{{.Clue.Description}}{{end}}</textarea>
      </div>
      <div class="row mb-2">
        <div class="col">
          <label class="form-label">Type</label>
          <select name="clue_type" class="form-select">
            <option value="direct" {{if and .Clue (eq .Clue.ClueType "direct")}}selected{{end}}>Direct</option>
            <option value="witness" {{if and .Clue (eq .Clue.ClueType "witness")}}selected{{end}}>Witness</option>
            <option value="object" {{if and .Clue (eq .Clue.ClueType "object")}}selected{{end}}>Object</option>
            <option value="location" {{if and .Clue (eq .Clue.ClueType "location")}}selected{{end}}>Location</option>
          </select>
        </div>
        <div class="col">
          <label class="form-label">Sort Order</label>
          <input type="number" name="sort_order" class="form-control" value="{{if .Clue}}{{.Clue.SortOrder}}{{else}}0{{end}}">
        </div>
      </div>
      <div class="mb-2">
        <label class="form-label">Notes (DM only)</label>
        <textarea name="notes" class="form-control" rows="2">{{if .Clue}}{{.Clue.Notes}}{{end}}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">{{if .Clue}}Update{{else}}Create{{end}}</button>
        <button type="button" class="btn btn-secondary" onclick="this.closest('.card').remove()">Cancel</button>
      </div>
    </form>
  </div>
</div>
