<div class="d-flex justify-content-between align-items-center">
  <h5>Journal</h5>
  <button class="btn btn-primary btn-sm" hx-get="/htmx/journal/new?character_id={{.CharacterID}}" hx-target="#genericModalBody" hx-trigger="click" data-bs-toggle="modal" data-bs-target="#genericModal" onclick="document.getElementById('genericModalTitle').textContent='New Entry'"><i class="fa-solid fa-plus me-1"></i>New Entry</button>
</div>
{{if .Entries}}
  {{range .Entries}}
  <div class="card mb-2">
    <div class="card-body py-2 px-3">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <span class="fw-bold">{{.Title}}</span>
          <span class="badge badge-blood ms-1">{{.EntryDate}}</span>
          <p class="mb-0 mt-1 small text-muted">{{.Entry | truncate 200}}</p>
        </div>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-outline-primary" hx-get="/htmx/journal/{{.ID}}/edit" hx-target="#genericModalBody" hx-trigger="click" data-bs-toggle="modal" data-bs-target="#genericModal" onclick="document.getElementById('genericModalTitle').textContent='Edit Entry'"><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-sm btn-outline-danger" hx-delete="/htmx/journal/{{.ID}}" hx-target="#journalSection" hx-swap="outerHTML" hx-confirm="Delete this entry?"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    </div>
  </div>
  {{end}}
{{else}}
  <div class="empty-state"><i class="fa-solid fa-book-journal-whills fa-3x mb-2 d-block text-muted"></i><p class="fw-bold">Empty Journal</p><p class="small text-muted">Record your character's thoughts and experiences.</p></div>
{{end}}
