<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shared File</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #12141a; color: #e8e6e3; margin: 0; padding: 24px; line-height: 1.55; }
  .card { max-width: 900px; margin: 0 auto; background: #1c1f28; border: 1px solid #2b3040; border-radius: 12px; padding: 24px; text-align: center; }
  img { max-width: 100%; max-height: 80vh; border-radius: 8px; }
  .pdfwrap { height: 80vh; }
  .pdfwrap iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
  .footer { margin-top: 20px; color: #6b7385; font-size: .75rem; }
  a.dl { color: #7ab8ff; }
</style>
</head>
<body>
<div class="card">
  {{if eq .Ext ".pdf"}}
  <div class="pdfwrap"><iframe src="{{.URL}}" title="Shared PDF"></iframe></div>
  {{else if .URL}}
  <img src="{{if .ResizedURL}}{{.ResizedURL}}{{else}}{{.URL}}{{end}}" alt="Shared file">
  {{end}}
  <div class="footer">
    <a class="dl" href="{{.URL}}" target="_blank" rel="noopener">Open original file</a>
  </div>
</div>
</body>
</html>
