{{define "campaign_encounter_monsters"}}
<div class="d-flex justify-content-between align-items-center mb-2">
  <div>
    <strong>{{.EncounterName}}</strong>
    <button class="btn btn-sm btn-outline-secondary ms-2" onclick="showEncounterList({{.CampaignID}})"><i class="fa-solid fa-arrow-left me-1"></i>Back</button>
  </div>
  <div class="d-flex gap-1">
    <button class="btn btn-sm btn-outline-primary" onclick="showAddEncounterMonsterForm({{.EncounterID}}, {{.CampaignID}})"><i class="fa-solid fa-plus me-1"></i>Add Monster</button>
    <button class="btn btn-sm btn-outline-info" onclick="showCompendiumMonsterPicker({{.EncounterID}}, {{.CampaignID}})" title="Import from Compendium"><i class="fa-solid fa-book me-1"></i>Compendium</button>
  </div>
</div>
{{if .Monsters}}
<div class="list-group list-group-flush">
  {{range .Monsters}}
  <div class="list-group-item px-2 py-1 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <strong>{{.Name}}</strong>
      <span class="badge bg-secondary">CR {{.CR}}</span>
      <span class="badge bg-danger">×{{.Count}}</span>
      <span class="text-muted small">AC {{.AC}} HP {{.HP}}</span>
      {{if .Source}}<span class="badge bg-light text-dark small">{{.Source}}</span>{{end}}
    </div>
    <div class="d-flex gap-1">
      <button class="btn btn-sm btn-outline-warning" onclick="editEncounterMonster({{.ID}}, {{.EncounterID}}, {{$.CampaignID}})" title="Edit"><i class="fa-solid fa-pen"></i></button>
      <button class="btn btn-sm btn-outline-danger" onclick="deleteEncounterMonster({{.ID}}, {{.EncounterID}}, {{$.CampaignID}})" title="Delete"><i class="fa-solid fa-trash"></i></button>
    </div>
  </div>
  {{end}}
</div>
{{else}}
<div class="text-muted small fst-italic py-2">No monsters in this encounter. Add one or import from the compendium.</div>
{{end}}
{{end}}
