services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6270:6280"
    environment:
      - DB_PATH=/tmp/villum-test.db
      - PORT=6280
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6280/api/check-setup"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    depends_on:
      app:
        condition: service_healthy
    environment:
      - CI=true
      - BASE_URL=http://app:6280
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "
        npm ci &&
        npx playwright test --project=chromium --project=mobile-chrome
      "
