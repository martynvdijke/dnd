---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
polling_verb: get
framework_version: latest
polling_url: "https://dnd.example.com/api/trmnl/character-stats\r\nhttps://dnd.example.com/api/trmnl/campaign-stats\r\nhttps://dnd.example.com/api/trmnl/characters"
id: 443731
refresh_interval: 1440
custom_fields:
  - keyname: url
    field_type: url
    name: Instance URL
    description: Base URL of your Villum instance (e.g. https://dnd.example.com)
    placeholder: https://dnd.example.com
    help_text: Used for asset references when polling from this instance.
  - keyname: token
    field_type: string
    name: Access token
    description: TRMNL access token from the Villum admin settings
    placeholder: Paste token from the admin panel
    help_text: Generate or regenerate it in the Villum admin panel under TRMNL.
  - keyname: character_id
    field_type: string
    name: Character ID
    description: Numeric ID of the character to display
    placeholder: "1"
    help_text: Shown in the character URL when viewing a character in Villum.
  - keyname: display_mode
    field_type: string
    name: Display mode
    description: Show character stats, campaign progress, or the full party roster
    placeholder: roster
    help_text: "character, campaign or roster"
  - keyname: bio
    name: About This Plugin
    category: entertainment
    field_type: author_bio
    description: I am running a D&D campaign with friends, this pulls our character stats and campaign progress from my Villum instance into my trmnl.
    github_url: https://github.com/martynvdijke/dnd
    learn_more_url: https://github.com/martynvdijke/dnd
    email_address: martyn@vandijke.xyz
name: Villum - D&D Stats
description: Villum D&D stats for TRMNL
