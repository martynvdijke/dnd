repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: go vet -tags sqlite_fts5 ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: go build
        entry: go build -tags sqlite_fts5 -o /dev/null ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: tsc
        name: typescript check
        entry: npx tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      - id: vitest
        name: typescript unit tests
        entry: npx vitest run
        language: system
        pass_filenames: false

      - id: no-waitForTimeout
        name: forbid waitForTimeout in tests
        entry: bash -c 'if rg -n "waitForTimeout" tests/ | grep -v "allow-waitForTimeout" | grep -q .; then echo "waitForTimeout forbidden"; rg -n "waitForTimeout" tests/ | grep -v "allow-waitForTimeout"; exit 1; fi'
        language: system
        pass_filenames: false

      - id: ci-parity
        name: full CI parity suite
        entry: task ci
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
