<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>villum — Reset Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/eink.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#10022;</text></svg>">
</head>
<body>
<div class="login-container">
  <div class="card position-relative">
    <div class="card-body p-4 p-md-5">
      <h1 class="h2 text-center mb-1 brand-lockup brand-lockup-centered"><img src="/static/brand/logo-mark.svg" alt="" class="brand-mark"> <span>villum</span></h1>
      <p class="text-center text-muted fst-italic mb-4">Reset your password</p>
      <div id="msg" class="alert d-none"></div>
      <form id="resetForm" onsubmit="return false">
        <div class="mb-3">
          <label for="newPassword" class="form-label">New password</label>
          <input type="password" id="newPassword" class="form-control" required autocomplete="new-password" minlength="8">
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm password</label>
          <input type="password" id="confirmPassword" class="form-control" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Reset Password</button>
      </form>
      <div class="text-center mt-3"><a href="/login" class="small">Back to login</a></div>
      <div class="ornament mt-3">✧ ✦ ✧</div>
    </div>
  </div>
  <footer class="text-center text-muted mt-3" style="font-size:0.75rem">v{{VERSION}}</footer>
</div>
<script type="module" src="/static/js/reset.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
