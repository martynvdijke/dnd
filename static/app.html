<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>villum — Character Folio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Vollkorn:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✧</text></svg>">
</head>
<body>

<nav class="navbar navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#">✧ villum</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-md-0">
        <li class="nav-item"><a class="nav-link" href="#" onclick="showView('characters');loadCharacters();return false"><i class="fa-solid fa-users me-1"></i>Characters</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showParty();return false"><i class="fa-solid fa-flag me-1"></i>Party</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showCompendium();return false"><i class="fa-solid fa-book me-1"></i>Compendium</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showView('dice');loadDiceHistory();return false"><i class="fa-solid fa-dice me-1"></i>Dice</a></li>
        <li class="nav-item" id="adminNavItem" style="display:none"><a class="nav-link" href="/admin"><i class="fa-solid fa-shield-halved me-1"></i>Admin</a></li>
      </ul>
      <span class="navbar-text me-3" id="userName"></span>
      <a href="#" class="btn btn-outline-primary btn-sm" onclick="logout();return false"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">

<div id="charactersView">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h1 class="h2 mb-0">Character Folio</h1>
    <div class="d-flex gap-2">
      <button class="btn btn-gold btn-sm" onclick="newChar()"><i class="fa-solid fa-plus me-1"></i>New Character</button>
      <button class="btn btn-outline-primary btn-sm" onclick="showImport()"><i class="fa-solid fa-file-import me-1"></i>Import</button>
    </div>
  </div>
  <div id="charGrid" class="row g-3"></div>
</div>

<div id="sheetView" style="display:none">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
    <div>
      <h1 class="h2 mb-0" id="sheetName"></h1>
      <p class="text-muted fst-italic mb-0 mt-1" id="sheetSubtitle"></p>
    </div>
    <div class="d-flex gap-2 no-print">
      <button class="btn btn-outline-primary btn-sm" onclick="printChar()"><i class="fa-solid fa-print me-1"></i>Print</button>
      <button class="btn btn-outline-primary btn-sm" onclick="exportChar()"><i class="fa-solid fa-download me-1"></i>Export</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="showView('characters');loadCharacters();return false"><i class="fa-solid fa-arrow-left me-1"></i>Back</button>
    </div>
  </div>
  <div class="ornament mb-3">✧ ✦ ✧</div>
  <ul class="nav nav-tabs mb-3" id="tabBar" role="tablist"></ul>
  <div id="statsSection"></div>
  <div id="combatSection" style="display:none"></div>
  <div id="spellsSection" style="display:none"></div>
  <div id="inventorySection" style="display:none"></div>
  <div id="featuresSection" style="display:none"></div>
  <div id="locationsSection" style="display:none"></div>
  <div id="npcsSection" style="display:none"></div>
  <div id="sessionsSection" style="display:none"></div>
  <div id="questsSection" style="display:none"></div>
  <div id="journalSection" style="display:none"></div>
  <div id="graphSection" style="display:none"></div>
  <div id="analyticsSection" style="display:none"></div>
  <div id="detailsSection" style="display:none"></div>
  <div id="diceSection"></div>
</div>

<div id="diceView" style="display:none">
  <h1 class="h2 mb-3"><i class="fa-solid fa-dice me-2"></i>Dice Roller</h1>
  <div id="diceSection"></div>
</div>

<div id="partyView" style="display:none">
  <h1 class="h2 mb-3"><i class="fa-solid fa-flag me-2"></i>Party View</h1>
  <div id="partyContent"></div>
</div>

<div id="compendiumView" style="display:none">
  <h1 class="h2 mb-3"><i class="fa-solid fa-book me-2"></i>Compendium</h1>
  <ul class="nav nav-tabs mb-3" id="compendiumTabs">
    <li class="nav-item"><button class="nav-link active" id="compTabRaces" onclick="loadCompendiumTab('races')">Races</button></li>
    <li class="nav-item"><button class="nav-link" id="compTabClasses" onclick="loadCompendiumTab('classes')">Classes</button></li>
    <li class="nav-item"><button class="nav-link" id="compTabSpells" onclick="loadCompendiumTab('spells')">Spells</button></li>
    <li class="nav-item"><button class="nav-link" id="compTabEquipment" onclick="loadCompendiumTab('equipment')">Equipment</button></li>
  </ul>
  <div id="compRaces"></div>
  <div id="compClasses" style="display:none"></div>
  <div id="compSpells" style="display:none"></div>
  <div id="compEquipment" style="display:none"></div>
</div>

</div>

<div class="toast-container toast-custom" id="toastContainer"></div>

<div class="modal fade" id="genericModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="genericModalTitle">Modal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="genericModalBody"></div>
    </div>
  </div>
</div>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(r=>r.unregister()));</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
