<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vellum — Admin</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✧</text></svg>">
</head>
<body>
<div class="header">
  <div class="header-brand">Vellum — Admin</div>
  <div class="header-nav">
    <a href="/app">Back to App</a>
    <a href="#" onclick="logout();return false">Logout</a>
  </div>
</div>
<div class="container">

<div class="tabs">
  <button class="tab active" id="tabUsers" onclick="showAdminTab('users')">Users</button>
  <button class="tab" id="tabCompendium" onclick="showAdminTab('compendium')">Compendium</button>
  <button class="tab" id="tabBackup" onclick="showAdminTab('backup')">Backup</button>
</div>

<div id="adminUsers">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h1>Users</h1>
    <button class="btn btn-primary btn-sm" onclick="showAddUser()">+ Add User</button>
  </div>
  <table id="userTable">
    <thead><tr><th>ID</th><th>Username</th><th>Display Name</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div id="adminCompendium" style="display:none">
  <h1>Compendium Management</h1>
  <div class="form-row" style="margin-bottom:16px">
    <div class="form-group">
      <label>Type</label>
      <select id="compType" onchange="loadCompEntries()">
        <option value="races">Races</option>
        <option value="classes">Classes</option>
        <option value="spells">Spells</option>
        <option value="feats">Feats</option>
        <option value="backgrounds">Backgrounds</option>
        <option value="equipment">Equipment</option>
      </select>
    </div>
    <div class="form-group">
      <label>&nbsp;</label>
      <button class="btn btn-primary" onclick="showAddCompEntry()">+ Add</button>
    </div>
  </div>
  <div id="compEntries"><p style="color:var(--text-muted)">Select a type to view entries</p></div>
</div>

<div id="adminBackup" style="display:none">
  <h1>Backup</h1>
  <div class="card">
    <h3>Settings</h3>
    <div class="form-row">
      <div class="form-group">
        <label><input type="checkbox" id="backupEnabled"> Enable automatic backups</label>
      </div>
      <div class="form-group">
        <label>Interval (hours)</label>
        <input type="number" id="backupInterval" value="168">
      </div>
    </div>
    <button class="btn btn-gold" onclick="saveBackupSettings()">Save Settings</button>
    <button class="btn" onclick="triggerBackup()" style="margin-left:8px">Backup Now</button>
  </div>
  <h3>Existing Backups</h3>
  <div id="backupList"></div>
</div>

</div>
<script src="/static/js/admin.js"></script>
</body>
</html>
