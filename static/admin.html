<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>villum — Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Vollkorn:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✧</text></svg>">
</head>
<body>

<nav class="navbar navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#">✧ villum — Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="adminNav">
      <ul class="navbar-nav ms-auto mb-2 mb-md-0">
        <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-arrow-left me-1"></i>Back to App</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="toggleTheme();return false" title="Toggle dark/light mode"><i class="fa-solid fa-moon" id="themeIcon"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="logout();return false"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">

<ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
  <li class="nav-item"><button class="nav-link active" id="tabUsersBtn" onclick="showAdminTab('users')"><i class="fa-solid fa-users me-1"></i>Users</button></li>
  <li class="nav-item"><button class="nav-link" id="tabCompendiumBtn" onclick="showAdminTab('compendium')"><i class="fa-solid fa-book me-1"></i>Compendium</button></li>
  <li class="nav-item"><button class="nav-link" id="tabBackupBtn" onclick="showAdminTab('backup')"><i class="fa-solid fa-floppy-disk me-1"></i>Backup</button></li>
</ul>

<div id="adminUsers">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span><i class="fa-solid fa-users me-2"></i>Users</span>
      <button class="btn btn-primary btn-sm" onclick="showAddUser()"><i class="fa-solid fa-plus me-1"></i>Add User</button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0" id="userTable">
          <thead><tr><th>ID</th><th>Username</th><th>Display Name</th><th>Email</th><th>Role</th><th>Created</th><th style="width:200px">Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="adminCompendium" style="display:none">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span><i class="fa-solid fa-book me-2"></i>Compendium Management</span>
      <button class="btn btn-primary btn-sm" onclick="showAddCompEntry()"><i class="fa-solid fa-plus me-1"></i>Add Entry</button>
    </div>
    <div class="card-body">
      <div class="row g-3 mb-3">
        <div class="col-auto">
          <label class="form-label">Type</label>
          <select id="compType" class="form-select" onchange="loadCompEntries()">
            <option value="races">Races</option>
            <option value="classes">Classes</option>
            <option value="spells">Spells</option>
            <option value="feats">Feats</option>
            <option value="backgrounds">Backgrounds</option>
            <option value="equipment">Equipment</option>
          </select>
        </div>
      </div>
      <div id="compEntries"><p class="text-muted">Select a type to view entries</p></div>
    </div>
  </div>
</div>

<div id="adminBackup" style="display:none">
  <div class="card mb-4">
    <div class="card-header"><i class="fa-solid fa-gear me-2"></i>Backup Settings</div>
    <div class="card-body">
      <div class="mb-3">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="backupEnabled">
          <label class="form-check-label" for="backupEnabled">Enable automatic backups</label>
        </div>
      </div>
      <div class="row g-3 align-items-end">
        <div class="col-auto">
          <label class="form-label" for="backupInterval">Interval (hours)</label>
          <input type="number" id="backupInterval" class="form-control" value="168" style="width:120px">
        </div>
        <div class="col-auto">
          <button class="btn btn-gold" onclick="saveBackupSettings()"><i class="fa-solid fa-floppy-disk me-1"></i>Save Settings</button>
        </div>
        <div class="col-auto">
          <button class="btn btn-outline-primary" onclick="triggerBackup()"><i class="fa-solid fa-clock-rotate-left me-1"></i>Backup Now</button>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><i class="fa-solid fa-list me-2"></i>Existing Backups</div>
    <div class="card-body" id="backupList"></div>
  </div>
</div>

</div>

<div class="toast-container toast-custom" id="toastContainer"></div>

<div class="modal fade" id="genericModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="genericModalTitle">Modal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="genericModalBody"></div>
    </div>
  </div>
</div>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(r=>r.unregister()));</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
