<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>villum — Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
<!-- Fonts are self-hosted: @font-face in /static/style.css, files in /static/fonts -->
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✧</text></svg>">
</head>
<body>
<div class="login-container">
  <div class="card position-relative">
    <div class="card-body p-4 p-md-5">
      <h1 class="h2 text-center mb-1">✧ villum</h1>
      <p class="text-center text-muted fst-italic mb-4">A D&D Character Folio</p>
      <div id="error" class="alert alert-danger d-none"></div>
      <form id="loginForm" onsubmit="return false">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2"><i class="fa-solid fa-key me-2" aria-hidden="true"></i>Enter the Archives</button>
      </form>
      <div class="ornament mt-3">✧ ✦ ✧</div>
      <div class="text-center mt-3"><a href="#" onclick="toggleTheme();return false" class="text-muted small"><i class="fa-solid fa-moon" aria-hidden="true" id="themeIcon"></i> <span id="themeLabel">Dark Mode</span></a></div>
    </div>
  </div>
  <footer class="text-center text-muted mt-3" style="font-size:0.75rem">
    <div class="mb-1"><a href="/events" class="text-muted text-decoration-none"><i class="fa-regular fa-calendar me-1"></i>View Events</a></div>
    <i class="fa-solid fa-code-branch me-1" aria-hidden="true"></i>v{{VERSION}} &mdash; <a href="https://github.com/martynvdijke/dnd" target="_blank" rel="noopener" class="text-muted text-decoration-none"><i class="fa-brands fa-github me-1"></i> Source</a>
  </footer>
</div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(r=>r.unregister()));</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
