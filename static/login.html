<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vellum — Login</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✧</text></svg>">
</head>
<body>
<div class="login-container">
  <h1>Vellum</h1>
  <p class="subtitle">A D&D Character Folio</p>
  <div id="error" style="display:none;color:var(--danger);margin-bottom:12px;font-style:italic;"></div>
  <form id="loginForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;font-size:1rem;padding:12px;">Enter the Archives</button>
  </form>
  <div class="ornament">✧ ✦ ✧</div>
</div>
<script src="/static/js/login.js"></script>
</body>
</html>
