name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: go mod download
      - run: npm ci
      - run: npx tsc
      - run: go vet -tags fts5 ./...
      - run: go test -tags fts5 -v ./...
