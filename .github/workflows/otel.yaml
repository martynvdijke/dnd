name: OTel Export

on:
  workflow_call:

jobs:
  # No `permissions:` here on purpose. This reusable workflow is called by
  # renovate.yml / stale-branches.yml, whose token grants do not include the
  # actions/pull-requests/checks scopes. Requesting them from the called
  # workflow exceeded the callers' grants and failed the run at startup.
  # Re-add scopes here AND grant them in the callers before re-enabling the action.
  otel:
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    steps:
      # uses: corentinmusard/otel-cicd-action@v4 (actual action disabled due to reusable startup issue, see inline)
      - run: echo "otel export stub - corentinmusard/otel-cicd-action@v4"
