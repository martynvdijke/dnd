name: CI checks

on:
  workflow_call:
  pull_request:
    branches: ["**"]

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

# Coverage thresholds (documented per task 7.5):
#   Go: handlers/ >= 30%, middleware/ >= 25% (measured 08-2026: 35.8% / 30.6%;
#       the root package is wiring-only and is covered via the handlers/ and
#       middleware/ coverpkg - total stays >= 20%)
#   TS: vitest coverage-v8 >= 20% (enforced in unit-test job)
jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build embedded static bundles
        run: npm run build:vite

      - name: Vet
        run: go vet -tags sqlite_fts5 ./...

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Verify data-testids are referenced by tests
        run: |
          FAIL=0
          while read -r tid; do
            [ -z "$tid" ] && continue
            if ! grep -rq -- "$tid" tests/; then
              # nav-* testids are constructed dynamically in helpers.ts (nav-${nav});
              # accept them when the nav id appears in tests alongside the template
              case "$tid" in
                nav-*)
                  suffix="${tid#nav-}"
                  if grep -rq 'nav-\${nav}' tests/helpers.ts && grep -rq -- "$suffix" tests/; then
                    continue
                  fi
                  ;;
              esac
              echo "data-testid \"$tid\" has no test reference"
              FAIL=1
            fi
          done < <(grep -rhoE 'data-testid="[^"]+"' ts/ static/app.html static/login.html static/admin.html | sed 's/.*="\(.*\)"/\1/' | sort -u)
          exit $FAIL

  unit-test:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Download Go dependencies
        run: go mod download

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build embedded static bundles
        run: npm run build:vite

      - name: Run Tests with Coverage
        run:
          go test -tags "sqlite_fts5" -v -coverprofile=coverage.out -covermode=atomic -coverpkg=./handlers/...,./middleware/... ./...

      - name: Check Per-Package Coverage Thresholds
        run: |
          go tool cover -func=coverage.out | tee /dev/stderr | awk '
            /^total:/ {
              gsub(/%/, "", $3)
              if ($3 + 0 < 20) {
                printf "FAIL: total coverage %.1f%% < 20%% threshold\n", $3
                exit 1
              }
              printf "PASS: total coverage %.1f%% >= 20%% threshold\n", $3
            }'
          awk '/^mode:/{print; next} $1 ~ /^villum\/handlers\//{print}' coverage.out > /tmp/handlers.out
          awk '/^mode:/{print; next} $1 ~ /^villum\/middleware\//{print}' coverage.out > /tmp/middleware.out
          H=$(go tool cover -func=/tmp/handlers.out | awk '/^total:/ { gsub(/%/, "", $3); printf "%.1f", $3 }')
          M=$(go tool cover -func=/tmp/middleware.out | awk '/^total:/ { gsub(/%/, "", $3); printf "%.1f", $3 }')
          printf "handlers/ coverage: %s%% (threshold 30%%)\n" "$H"
          printf "middleware/ coverage: %s%% (threshold 25%%)\n" "$M"
          awk -v h="$H" -v m="$M" 'BEGIN {
            fail = 0
            if (h + 0 < 30) { print "FAIL: handlers/ coverage below 30% threshold"; fail = 1 }
            if (m + 0 < 25) { print "FAIL: middleware/ coverage below 25% threshold"; fail = 1 }
            exit fail
          }'
          go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); printf "%.1f\n", $3 }' > /tmp/cov-total.txt

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 30

      - name: Run TypeScript unit tests with coverage
        run: npx vitest run --coverage

  e2e:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Download Go dependencies
        run: go mod download

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      - name: Build server binary
        run: go build -tags sqlite_fts5 -o villum-server .

      - name: Docker build smoke test
        run: docker build . --file Dockerfile --tag dnd-smoke:test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        timeout-minutes: 30
        env:
          CI: true

      - name: Capture flaky test report
        if: ${{ !cancelled() }}
        run: |
          node -e 'const fs=require("fs"); let flaky=[]; try { const r=JSON.parse(fs.readFileSync("test-results/.last-run.json","utf8")); flaky=r.flaky||[]; } catch(e) {} const lines=["# Flaky tests (passed on retry)"]; for (const t of flaky) lines.push("- "+t); fs.writeFileSync("flaky-tests.log", lines.join("\n")+"\n"); console.log("flaky count:", flaky.length);'

      - name: Upload flaky tests log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flaky-tests
          path: flaky-tests.log
          retention-days: 30

      - name: Summarize flaky tests
        if: ${{ !cancelled() }}
        run: |
          echo "::group::Flaky tests"
          cat flaky-tests.log
          echo "::endgroup::"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  trml:
    name: TRMNL Plugin Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install trmnl_preview
        run: gem install trmnl_preview

      - name: Lint TRMNL plugin
        working-directory: trmnl
        run: trmnlp lint

  otel:
    permissions:
      contents: read # Required. To access the private repository
      actions: read # Required. To read workflow runs
      pull-requests: read # Optional. To read PR labels
      checks: read # Optional. To read run annotations
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [e2e, trml]
    steps:
      - name: Export workflow
        uses: corentinmusard/otel-cicd-action@v4
        with:
          otlpEndpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
