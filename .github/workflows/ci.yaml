name: CI checks

on:
  workflow_call:
  pull_request:
    branches: ["**"]

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

# Coverage thresholds (documented per task 7.5, bumped 09-2026 via close-coverage-holes):
#   Go: handlers/ >= 40%, middleware/ >= 40% (measured 09-2026: 72.1% / 86.9%;
#       the root package is wiring-only and is covered via the handlers/ and
#       middleware/ coverpkg - total stays >= 20%)
#   TS: vitest coverage-v8 >= 20% (enforced in unit-test job, measured 09-2026: 40.68% / 35.75% / 40.17% / 42.98%)
jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup

      - name: Check go.mod is tidy
        run: scripts/ci/check-tidy.sh

      - name: Vet
        run: scripts/ci/check-vet.sh

      - name: Check formatting
        run: scripts/ci/check-fmt.sh

      - name: Typecheck TypeScript
        run: scripts/ci/check-ts.sh

      - name: Verify data-testids are referenced by tests
        run: scripts/ci/check-testid.sh

      - name: Forbid waitForTimeout in tests
        run: |
          if rg -n "waitForTimeout" tests/ | grep -v "allow-waitForTimeout" | grep -q .; then
            echo "ERROR: waitForTimeout found — replace with expect().toBeVisible()/waitForResponse/waitForFunction"
            rg -n "waitForTimeout" tests/ | grep -v "allow-waitForTimeout"
            exit 1
          fi

  unit-test:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Tests with Coverage
        run: scripts/ci/test-go.sh

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 30

      - name: Run TypeScript unit tests with coverage
        run: scripts/ci/test-vitest.sh

  e2e:
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup

      - name: Build server binary
        run: scripts/ci/build-server.sh

      - name: Docker build smoke test
        run: scripts/ci/test-docker.sh

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # CI runs --project=chromium only; firefox/mobile-chrome projects in playwright.config.ts remain for local debugging.
      - name: Run Playwright tests
        run: npx playwright test --project=chromium --reporter=list
        env:
          CI: true

      - name: Capture flaky test report
        if: ${{ !cancelled() }}
        run: |
          node -e 'const fs=require("fs"); let flaky=[]; try { const r=JSON.parse(fs.readFileSync("test-results/.last-run.json","utf8")); flaky=r.flaky||[]; } catch(e) {} const lines=["# Flaky tests (passed on retry)"]; for (const t of flaky) lines.push("- "+t); fs.writeFileSync("flaky-tests.log", lines.join("\n")+"\n"); console.log("flaky count:", flaky.length);'

      - name: Upload flaky tests log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flaky-tests
          path: flaky-tests.log
          retention-days: 30

      - name: Summarize flaky tests
        if: ${{ !cancelled() }}
        run: |
          echo "::group::Flaky tests"
          cat flaky-tests.log
          echo "::endgroup::"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  trml:
    name: TRMNL Plugin Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'

      - name: Install trmnl_preview
        run: gem install trmnl_preview

      - name: Lint TRMNL plugin
        working-directory: trmnl
        run: trmnlp lint

  otel:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    if: ${{ !cancelled() }}
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [e2e, trml]
    steps:
      - name: Export workflow
        uses: corentinmusard/otel-cicd-action@895874bfae14f840e3032f1a14c3f2b45c93f4af # v4
        with:
          otlpEndpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
